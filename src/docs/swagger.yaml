openapi: 3.0.3
info:
  title: Kukin API
  version: 1.0.0
  description: API for managing food products (CRUD + bulk upload).

servers:
  - url: https://kukinbackend.onrender.com/api
    description: Production server (Render)
  - url: http://localhost:5000/api
    description: Local development server

paths:
  /products:
    get:
      summary: Get all products
      tags:
        - Products
      responses:
        "200":
          description: List of all products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
        "500":
          description: Server error while fetching products

    post:
      summary: Create a new product
      tags:
        - Products
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Product created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Invalid input data

  /products/{id}:
    get:
      summary: Get a product by ID
      tags:
        - Products
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Product not found
        "500":
          description: Server error while fetching product

    put:
      summary: Update a product by ID
      tags:
        - Products
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "200":
          description: Product updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Invalid update data
        "404":
          description: Product not found

    delete:
      summary: Delete a product by ID
      tags:
        - Products
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product deleted successfully
        "400":
          description: Invalid ID format
        "404":
          description: Product not found
        "500":
          description: Server error while deleting

  /products/bulk:
    post:
      summary: Bulk upload products (insert or update with upsert)
      tags:
        - Products
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Bulk upload completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  matched:
                    type: integer
                  inserted:
                    type: integer
                  modified:
                    type: integer
        "400":
          description: Invalid input (must be a non-empty array)

components:
  schemas:
    Product:
      type: object
      properties:
        id:
          type: integer
          example: 101
        foodType:
          type: string
          description: "Product category (Soups, Rice, Meat, Swallows, Street, Drinks)"
          example: "Soups"
        name:
          type: string
          example: "Margherita"
        desc:
          type: string
          example: "Classic pizza with tomato sauce and cheese"
        rating:
          type: string
          example: "4.5"
        price:
          type: number
          example: 2500
        img:
          type: string
          example: "https://example.com/pizza.jpg"
        amount:
          type: integer
          example: 1
        isFav:
          type: boolean
          example: false
        isFresh:
          type: boolean
          example: true
        isPopular:
          type: boolean
          example: false
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ProductInput:
      type: object
      required:
        - id
        - foodType
        - name
        - desc
        - rating
        - price
        - img
      properties:
        id:
          type: integer
        foodType:
          type: string
        name:
          type: string
        desc:
          type: string
        rating:
          type: string
        price:
          type: number
        img:
          type: string
        amount:
          type: integer
          default: 1
        isFav:
          type: boolean
          default: false
        isFresh:
          type: boolean
          default: false
        isPopular:
          type: boolean
          default: false
