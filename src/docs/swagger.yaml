openapi: 3.0.3
info:
  title: Kukin API
  version: 1.0.0
  description: API for managing food products (CRUD + bulk upload).

servers:
  - url: https://kukinbackend.onrender.com/api
    description: Production server (Render)
  - url: http://localhost:5000/api
    description: Local development server

paths:
  /products:
    get:
      summary: Get all products
      tags:
        - Products
      responses:
        "200":
          description: List of all products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
        "500":
          description: Server error while fetching products

    post:
      summary: Create a new product
      tags:
        - Products
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Product created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Invalid input data

  /products/{id}:
    get:
      summary: Get a product by ID
      tags:
        - Products
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Product not found
        "500":
          description: Server error while fetching product

    put:
      summary: Update a product by ID
      tags:
        - Products
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "200":
          description: Product updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Invalid update data
        "404":
          description: Product not found

    delete:
      summary: Delete a product by ID
      tags:
        - Products
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product deleted successfully
        "400":
          description: Invalid ID format
        "404":
          description: Product not found
        "500":
          description: Server error while deleting

  /products/bulk:
    post:
      summary: Bulk upload products (insert or update with upsert)
      tags:
        - Products
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Bulk upload completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  matched:
                    type: integer
                  inserted:
                    type: integer
                  modified:
                    type: integer
        "400":
          description: Invalid input (must be a non-empty array)

  /auth/signup:
    post:
      summary: Create a local account and send a verification OTP
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupInput"
      responses:
        "201":
          description: Account created; verification code sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already in use

  /auth/signup/verify-otp:
    post:
      summary: Verify a signup OTP
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpInput"
      responses:
        "200":
          description: Email verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Invalid or expired code

  /auth/signup/resend-otp:
    post:
      summary: Resend a signup OTP
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailInput"
      responses:
        "200":
          description: New code sent
        "429":
          description: Resend cooldown active

  /auth/login:
    post:
      summary: Sign in with email and password
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
        "403":
          description: Email has not been verified

  /auth/logout:
    post:
      summary: Client-side logout acknowledgement
      tags: [Auth]
      responses:
        "204":
          description: Signed out

  /auth/me:
    get:
      summary: Get the current user
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
        "401":
          description: Authentication required
    patch:
      summary: Update the current user's name
      tags: [Auth]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  example: Ada Okafor
      responses:
        "200":
          description: Profile updated
        "400":
          description: Validation error

  /auth/avatar:
    post:
      summary: Upload a profile avatar
      tags: [Auth]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
      responses:
        "200":
          description: Avatar updated
        "400":
          description: Missing or invalid image

  /auth/password:
    patch:
      summary: Change or set a password
      tags: [Auth]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newPassword]
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
                confirmPassword:
                  type: string
      responses:
        "200":
          description: Password updated; a new token is returned
        "400":
          description: Current password is invalid

  /auth/forgot-password:
    post:
      summary: Send a password reset OTP
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailInput"
      responses:
        "202":
          description: Generic response to avoid email enumeration

  /auth/forgot-password/verify-otp:
    post:
      summary: Verify a password reset OTP
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpInput"
      responses:
        "200":
          description: Reset token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  resetToken:
                    type: string
                  email:
                    type: string
        "400":
          description: Invalid or expired code

  /auth/reset-password:
    post:
      summary: Reset a password using a reset token
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resetToken, newPassword]
              properties:
                resetToken:
                  type: string
                newPassword:
                  type: string
                confirmPassword:
                  type: string
      responses:
        "200":
          description: Password reset
        "401":
          description: Reset token invalid or expired

  /auth/providers:
    get:
      summary: List enabled social providers
      tags: [Auth]
      responses:
        "200":
          description: Provider availability
          content:
            application/json:
              schema:
                type: object
                properties:
                  google:
                    type: boolean
                    example: false
                  github:
                    type: boolean
                    example: false

  /auth/google:
    get:
      summary: Google OAuth placeholder (not implemented)
      tags: [Auth]
      responses:
        "501":
          description: Social sign-in is not implemented yet

  /auth/github:
    get:
      summary: GitHub OAuth placeholder (not implemented)
      tags: [Auth]
      responses:
        "501":
          description: Social sign-in is not implemented yet

  /cart:
    get:
      summary: Get the signed-in user's cart
      tags: [Cart]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "401":
          description: Authentication required
    put:
      summary: Replace the signed-in user's cart
      tags: [Cart]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    $ref: "#/components/schemas/CartItemInput"
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "400":
          description: Invalid products or quantities
    delete:
      summary: Clear the signed-in user's cart
      tags: [Cart]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Empty cart


components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Product:
      type: object
      properties:
        id:
          type: integer
          example: 101
        foodType:
          type: string
          description: "Product category (Soups, Rice, Meat, Swallows, Street, Drinks)"
          example: "Soups"
        name:
          type: string
          example: "Margherita"
        desc:
          type: string
          example: "Classic pizza with tomato sauce and cheese"
        rating:
          type: string
          example: "4.5"
        price:
          type: number
          example: 2500
        img:
          type: string
          example: "https://example.com/pizza.jpg"
        amount:
          type: integer
          example: 1
        isFav:
          type: boolean
          example: false
        isFresh:
          type: boolean
          example: true
        isPopular:
          type: boolean
          example: false
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ProductInput:
      type: object
      required:
        - id
        - foodType
        - name
        - desc
        - rating
        - price
        - img
      properties:
        id:
          type: integer
        foodType:
          type: string
        name:
          type: string
        desc:
          type: string
        rating:
          type: string
        price:
          type: number
        img:
          type: string
        amount:
          type: integer
          default: 1
        isFav:
          type: boolean
          default: false
        isFresh:
          type: boolean
          default: false
        isPopular:
          type: boolean
          default: false

    MessageResponse:
      type: object
      properties:
        message:
          type: string

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
        code:
          type: string
        errors:
          type: object
          additionalProperties:
            type: string

    SignupInput:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          example: Ada Okafor
        email:
          type: string
          format: email
          example: ada@example.com
        password:
          type: string
          format: password
          minLength: 8

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    EmailInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    OtpInput:
      type: object
      required: [email, otp]
      properties:
        email:
          type: string
          format: email
        otp:
          type: string
          pattern: '^\d{6}$'
          example: "123456"

    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        avatarUrl:
          type: string
        provider:
          type: string
          enum: [local, google, github]
        role:
          type: string
          enum: [customer, admin]
        isVerified:
          type: boolean
        hasPassword:
          type: boolean
        createdAt:
          type: string
          format: date-time

    AuthResponse:
      type: object
      properties:
        message:
          type: string
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"

    CartItemInput:
      type: object
      required: [productId, amount]
      properties:
        productId:
          type: integer
          example: 101
        amount:
          type: integer
          minimum: 1
          maximum: 99
          example: 2

    CartItem:
      allOf:
        - $ref: "#/components/schemas/Product"
        - type: object
          properties:
            amount:
              type: integer
            lineTotal:
              type: number

    Cart:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartItem"
        subtotal:
          type: number
        noOfItems:
          type: integer
